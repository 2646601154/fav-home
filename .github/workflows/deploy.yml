name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 定时同步 Star 的提交由 GITHUB_TOKEN 推上来，不会触发 push 事件，
  # 所以额外监听同步工作流结束，保证新数据能自动发布。
  workflow_run:
    workflows: ['Sync GitHub stars']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # 用户站点（<owner>.github.io）部署在根路径，
      # 其他仓库是项目站点，需要 /<repo> 作为 base。
      - name: Resolve base path
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          name="${GITHUB_REPOSITORY#*/}"
          if [ "$name" = "${owner}.github.io" ]; then
            echo "PUBLIC_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "PUBLIC_SITE_URL=https://${owner}.github.io" >> "$GITHUB_ENV"
          else
            echo "PUBLIC_BASE_PATH=/${name}" >> "$GITHUB_ENV"
            echo "PUBLIC_SITE_URL=https://${owner}.github.io/${name}" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
